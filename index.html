<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SI Luxury Chocolate</title>
</head>
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
<body>

<div id="header-placeholder"></div>

<section class="hero">
  <div class="slideshow-wrapper">
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
  </div>

  <div class="hero-content">
    <h1>Crafted Luxury in Every Bite</h1>
    <p>Premium handmade chocolates with elegance and passion.</p><br>
    <button class="btn">Discover Collection</button>
  </div>
</section>

<section class="products">
<h2>Featured Collection</h2><br>
<div class="products-grid">
<div class="card">
<h3>Dark Truffle</h3>
<p>CHF 12</p>
<button class="btn">Add to Bag</button>
</div>
<div class="card">
<h3>Hazelnut Praline</h3>
<p>CHF 15</p>
<button class="btn">Add to Bag</button>
</div>
<div class="card">
<h3>Milk Caramel</h3>
<p>CHF 10</p>
<button class="btn">Add to Bag</button>
</div>
</div>
</section>

<section class="reviews">
<h2>Client Reviews</h2><br>
<div class="review-inline">
<div class="card">★★★★★ Amazing luxury chocolate.</div>
<div class="card">★★★★★ Perfect gift quality.</div>
<div class="card">★★★★☆ Very elegant taste.</div>
</div>
</section>

<section class="contact">
<h2>Contact Us</h2><br>
<form>
<input type="text" placeholder="Your Name">
<input type="email" placeholder="Your Email">
<textarea placeholder="Your Message"></textarea>
<button class="btn">Send</button>
</form>
<br>
</section>

<div id="footer-placeholder"></div>

</body>
</html>
