<!DOCTYPE html>
<html lang="en">

<head>

    <title>SI Luxury Chocolate</title>
</head>
<link rel="stylesheet" href="../style.css">
<script src="../script.js"></script>

<body>

<section class="hero">

        </div>
        <div class="card">
            <h3>Hazelnut Praline</h3>

            <button class="btn">Add to Bag</button>
        </div>
        <div class="card">
            <h3>Milk Caramel</h3>

<div id="footer-placeholder"></div>
